services:
  postgres:
    image: postgres:16-alpine
    container_name: tripnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripnest
      POSTGRES_PASSWORD: tripnest
      POSTGRES_DB: tripnest
    ports:
      - "5432:5432"
    volumes:
      - tripnest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripnest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tripnest_postgres_data:
