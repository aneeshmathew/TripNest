<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#c9c1b1" fill-opacity="0.45" />
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#dots)" />

  <!-- dashed trail connecting a few of the icons -->
  <path d="M70 100 C130 150, 170 170, 190 140 C230 100, 270 110, 320 95 C360 82, 390 100, 430 190"
        fill="none" stroke="#7c8894" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round" opacity="0.4" />

  <!-- airplane -->
  <g transform="translate(55,90) rotate(-18)" fill="none" stroke="#7c8894" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M0 12 L38 0 L20 12 L38 24 Z" />
    <line x1="17" y1="11" x2="17" y2="21" />
  </g>

  <!-- compass -->
  <g transform="translate(325,70)" opacity="0.55">
    <circle cx="0" cy="0" r="17" fill="none" stroke="#7c8894" stroke-width="2" />
    <circle cx="0" cy="0" r="1.6" fill="#7c8894" />
    <path d="M-6 6 L3 -9 L6 -6 L-3 9 Z" fill="#7c8894" stroke="none" />
  </g>

  <!-- mountain range -->
  <g transform="translate(230,130)" fill="none" stroke="#7c8894" stroke-width="2"
     stroke-linejoin="round" stroke-linecap="round" opacity="0.5">
    <path d="M0 34 L16 8 L26 22 L38 2 L56 34 Z" />
    <path d="M10 22 L14 17 L18 22" />
  </g>

  <!-- bus / jeep -->
  <g transform="translate(60,230)" fill="none" stroke="#7c8894" stroke-width="2"
     stroke-linejoin="round" opacity="0.5">
    <rect x="0" y="0" width="50" height="22" rx="5" />
    <line x1="15" y1="0" x2="15" y2="22" />
    <line x1="32" y1="0" x2="32" y2="22" />
    <circle cx="11" cy="24" r="4.5" fill="none" />
    <circle cx="39" cy="24" r="4.5" fill="none" />
  </g>

  <!-- landmark / history -->
  <g transform="translate(300,230)" fill="none" stroke="#7c8894" stroke-width="2"
     stroke-linejoin="round" stroke-linecap="round" opacity="0.5">
    <path d="M-3 14 L21 0 L45 14" />
    <line x1="0" y1="14" x2="0" y2="36" />
    <line x1="10.5" y1="14" x2="10.5" y2="36" />
    <line x1="21" y1="14" x2="21" y2="36" />
    <line x1="31.5" y1="14" x2="31.5" y2="36" />
    <line x1="42" y1="14" x2="42" y2="36" />
    <line x1="-5" y1="36" x2="47" y2="36" />
  </g>

  <!-- suitcase -->
  <g transform="translate(410,150)" fill="none" stroke="#7c8894" stroke-width="2"
     stroke-linejoin="round" opacity="0.5">
    <rect x="0" y="8" width="32" height="22" rx="3" />
    <path d="M10 8 L10 3 Q10 0 13 0 L19 0 Q22 0 22 3 L22 8" />
    <line x1="0" y1="17" x2="32" y2="17" />
  </g>

  <!-- location pin -->
  <g transform="translate(150,360)" opacity="0.55">
    <path d="M0 0 C-9 0 -16 7 -16 16 C-16 27 0 44 0 44 C0 44 16 27 16 16 C16 7 9 0 0 0 Z"
          fill="none" stroke="#7c8894" stroke-width="2" />
    <circle cx="0" cy="15" r="4.5" fill="#7c8894" />
  </g>

  <!-- winding trail #2, lower area -->
  <path d="M40 400 C90 420, 130 440, 190 420 C240 405, 280 430, 340 440"
        fill="none" stroke="#7c8894" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round" opacity="0.35" />

  <!-- palm tree -->
  <g transform="translate(410,370)" fill="none" stroke="#7c8894" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M0 40 L4 10" />
    <path d="M4 10 C-6 4, -14 6, -18 0" />
    <path d="M4 10 C-2 2, -4 -6, 0 -12" />
    <path d="M4 10 C10 2, 18 2, 22 -4" />
    <path d="M4 10 C12 8, 18 12, 24 8" />
  </g>
</svg>
